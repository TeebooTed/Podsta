<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:1600px;font-family:Nunito,sans-serif;background:#FFF7EE;color:#2B1B3D;padding:50px;box-sizing:border-box}
h1{font-family:Fredoka;font-weight:600;font-size:44px;margin:0 0 30px}
h2{font-family:Fredoka;font-weight:600;font-size:24px;margin:30px 0 12px}
.row{display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap}
.cap{font-size:14px;margin-top:6px;text-align:center}
.sw{width:150px;height:100px;border-radius:16px;display:flex;align-items:flex-end;padding:10px;box-sizing:border-box;font-weight:800;font-size:14px}
.dark{background:#2B1B3D;padding:24px;border-radius:20px}
.ill{width:340px;background:#fff;border-radius:20px}
</style></head><body>
<h1>Podsta brand kit</h1>
<div class="row"><div><img src="../podsta-wordmark.png" width="560"></div><div class="dark"><img src="../podsta-wordmark-light.png" width="460"></div></div>
<h2>Icons</h2><div class="row">
<div><img src="../icon-512.png" width="200"><div class="cap">icon-512 / 192</div></div>
<div><img src="../maskable-512.png" width="200" style="border-radius:50%"><div class="cap">maskable (circle crop)</div></div>
<div><img src="../apple-touch-icon-180.png" width="180" style="border-radius:40px"><div class="cap">apple-touch-icon-180</div></div>
<div><img src="../favicon-32.png" width="32"> <img src="../favicon-32.png" width="16"><div class="cap">favicon 32 / 16</div></div></div>
<h2>Palette</h2><div class="row">
<div class="sw" style="background:#FF6B57;color:#2B1B3D">Coral #FF6B57</div>
<div class="sw" style="background:#E8457A;color:#fff">Berry #E8457A</div>
<div class="sw" style="background:#FFC547">Sunshine #FFC547</div>
<div class="sw" style="background:#3DD9A8">Mint #3DD9A8</div>
<div class="sw" style="background:#2B1B3D;color:#FFF7EE">Plum #2B1B3D</div>
<div class="sw" style="background:#FFF7EE;color:#2B1B3D;border:2px solid #2B1B3D">Cream #FFF7EE</div></div>
<h2>Spot illustrations</h2><div class="row">
<div><img class="ill" src="../illustrations/first-post.png"><div class="cap">first post</div></div>
<div><img class="ill" src="../illustrations/no-followers.png"><div class="cap">no followers yet</div></div>
<div><img class="ill" src="../illustrations/whats-a-pod.png"><div class="cap">what's a pod?</div></div>
<div><img class="ill" src="../illustrations/welcome.png"><div class="cap">welcome</div></div></div>
<h2>Social share</h2><img src="../podsta-share-1200x630.png" width="700" style="border-radius:16px;border:3px solid #2B1B3D">
</body></html>
